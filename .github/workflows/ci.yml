name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Read-only token: CI never needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — typecheck, build, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ml
          POSTGRES_PASSWORD: ml
          POSTGRES_DB: ml_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ml"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://ml:ml@localhost:5432/ml_test?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests (real Postgres, migrations applied from scratch)
        run: npm run test:e2e

      - name: Create shadow database for drift check
        run: PGPASSWORD=ml psql -h localhost -U ml -d ml_test -c 'CREATE DATABASE ml_shadow'

      - name: Migrations match schema (no drift)
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://ml:ml@localhost:5432/ml_shadow?schema=public" --exit-code
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  extension:
    name: Extension — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
      # Build first: Plasmo generates the messaging types that tsc needs.
      - run: npm run build
      - run: npx tsc --noEmit

  mobile:
    name: Mobile — analyze, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with apps/mobile/.metadata
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Get packages
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Build APK (debug)
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub
