services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    env_file: ./apps/server/.env
    environment:
      # inside the compose network the database is "postgres", not localhost
      DATABASE_URL: postgresql://mitaleet:mitaleet_dev@postgres:5432/mitaleet?schema=public
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mitaleet

  postgres:
    image: postgres:16-alpine
    container_name: mitaleet-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: mitaleet
      POSTGRES_PASSWORD: mitaleet_dev
      POSTGRES_DB: mitaleet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mitaleet']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mitaleet

  redis:
    image: redis:7-alpine
    container_name: mitaleet-redis
    ports:
      - '127.0.0.1:6379:6379'
    restart: unless-stopped
    networks:
      - mitaleet

volumes:
  pgdata:

networks:
  mitaleet:
    driver: bridge
