name: mitaleet
description: A realtime competitive coding operating system for private coding squads.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # Storage
  flutter_secure_storage: ^9.2.4

  # Auth
  google_sign_in: ^6.2.2

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.2.4

  # Icons: Phosphor is vendored (lib/core/theme/phosphor_icons.dart + assets/fonts)

  # Device timezone (IANA name) so streaks follow the user's local day
  flutter_timezone: ^5.1.1

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  fonts:
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
